plugins {
    id "com.android.application"
    id "kotlin-android"
    id "org.jetbrains.kotlin.plugin.compose"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    packagingOptions {
        jniLibs {
            pickFirsts += [
                    "lib/x86_64/libc++_shared.so",
                    "lib/arm64-v8a/libc++_shared.so",
                    "lib/armeabi-v7a/libc++_shared.so",
                    "lib/x86/libc++_shared.so",

                    "lib/x86_64/libass.so",
                    "lib/arm64-v8a/libass.so",
                    "lib/armeabi-v7a/libass.so",
                    "lib/x86/libass.so",
            ]
        }
    }
    namespace = "io.github.hamadtheironside.driftfin"
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required for java 8+ library desugaring (flutter_local_notifications and others)
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        compose = true
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "io.github.hamadtheironside.driftfin"
        minSdkVersion flutter.minSdkVersion
        targetSdk = 37
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Release signing. Drop android/app/keystore.jks + android/app/key.properties
    // (both gitignored — see keytool instructions in DEVELOPEMENT.md) to sign with
    // your own key. Without them, release builds fall back to the debug key so
    // `flutter build apk --release` still works with zero setup: the APK is
    // installable for personal/testing use, it just can't be published to Play.
    def hasReleaseKeystore = keystorePropertiesFile.exists()
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file('keystore.jks')
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            // R8 / resource shrinking is off by default. The release speedup comes
            // from AOT compilation, not minification, and R8 without verified keep
            // rules can strip native/reflection classes (media3, media_kit, Sentry)
            // and crash at runtime. To shrink the APK, flip both to true, then test
            // on a device — starter keep rules live in proguard-rules.pro.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug

            packagingOptions {
                resources {
                    excludes += ["assets/dexopt/baseline.prof", "assets/dexopt/baseline.profm"]
                }
            }
        }
    }

    flavorDimensions "default"
    productFlavors {
        development {
            dimension "default"
            applicationIdSuffix ".dev"
        }
        production {
            dimension "default"
            applicationIdSuffix ""
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.12.00')
    implementation composeBom
    androidTestImplementation composeBom
    implementation('androidx.compose.material3:material3')
    implementation('androidx.compose.ui:ui-tooling-preview')
    debugImplementation('androidx.compose.ui:ui-tooling')
    implementation('androidx.activity:activity-compose:1.12.1')

    // Required for Java 8+ desugaring used by some libraries
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Media3 (ExoPlayer)
    def media3_version = "1.8.0+1"
    implementation("androidx.media3:media3-exoplayer:$media3_version")
    implementation("androidx.media3:media3-session:$media3_version")
    implementation("androidx.media3:media3-ui:$media3_version")

    implementation("androidx.media3:media3-exoplayer-dash:$media3_version")
    implementation("androidx.media3:media3-exoplayer-hls:$media3_version")
    implementation("org.jellyfin.media3:media3-ffmpeg-decoder:$media3_version")
    implementation("io.github.peerless2012:ass-media:0.3.0")

    //UI
    implementation("io.github.rabehx:iconsax-compose:0.0.5")
    implementation("io.coil-kt.coil3:coil-compose:3.3.0")
    implementation("io.coil-kt.coil3:coil-network-okhttp:3.3.0")
    implementation("com.materialkolor:material-kolor:4.0.5")
}
