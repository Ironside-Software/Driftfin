name: Release Driftfin

# Resolve one commit, build each target once, then publish those artifacts.
# Tag pushes publish GitHub Releases and Pages. Manual runs are dry builds unless
# TestFlight is selected, in which case the iOS build is signed and uploaded.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      testflight:
        description: Also upload a signed iOS build to TestFlight
        required: true
        default: false
        type: boolean
      ios_only:
        description: Build only iOS (can be combined with TestFlight)
        required: true
        default: false
        type: boolean
      ref:
        description: Git ref to build for every platform (blank uses the selected branch)
        required: false
        type: string
      release_notes:
        description: Optional TestFlight What to Test notes
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.testflight && 'testflight' || inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(grep '^version:' pubspec.yaml | cut -d: -f2 | cut -d+ -f1 | tr -d ' ')-dev"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Driftfin version: $V"

  web:
    name: Build Web
    if: ${{ !inputs.ios_only }}
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --build-number=${{ github.run_number }}
      - name: Zip web bundle
        run: cd build/web && zip -r "../../Driftfin-Web-${{ needs.prepare.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: web
          path: Driftfin-Web-*.zip

  windows:
    name: Build Windows
    if: ${{ !inputs.ios_only }}
    needs: prepare
    runs-on: blacksmith-2vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --build-number=${{ github.run_number }}
      - name: Zip Windows bundle (portable)
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "Driftfin-Windows-${{ needs.prepare.outputs.version }}.zip"
      - name: Compile Inno Setup installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: windows/windows_setup.iss
          options: /O+ /DDRIFTFIN_VERSION="${{ needs.prepare.outputs.version }}"
      - name: Rename installer
        run: Move-Item windows\Output\driftfin_setup.exe "Driftfin-Windows-${{ needs.prepare.outputs.version }}-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: windows
          path: |
            Driftfin-Windows-*.zip
            Driftfin-Windows-*-Setup.exe

  ios:
    name: Build iOS
    needs: prepare
    runs-on: blacksmith-6vcpu-macos-latest
    environment: ${{ inputs.testflight && 'testflight' || '' }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      APPSTORE_BUNDLE_ID: app.driftfin.79758DD3NW
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Import App Store distribution certificate
        if: inputs.testflight == true
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Download App Store provisioning profile
        if: inputs.testflight == true
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.APPSTORE_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - run: flutter pub get
      - name: Build iOS (unsigned)
        if: inputs.testflight != true
        run: flutter build ios --release --no-codesign --flavor production --build-number=${{ github.run_number }}
      - name: Package unsigned .ipa
        if: inputs.testflight != true
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -qr "../../../Driftfin-iOS-${{ needs.prepare.outputs.version }}-unsigned.ipa" Payload
      - name: Build signed production IPA
        if: inputs.testflight == true
        run: >-
          flutter build ipa
          --release
          --flavor production
          --build-number=${{ github.run_number }}
          --export-options-plist=ios/exportOptions.plist
      - name: Collect signed IPA
        if: inputs.testflight == true
        run: cp build/ios/ipa/*.ipa "Driftfin-iOS-${{ needs.prepare.outputs.version }}-signed.ipa"
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: Driftfin-iOS-*.ipa
          if-no-files-found: error

  android:
    name: Build Android (${{ matrix.mode }})
    if: ${{ !inputs.ios_only }}
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Configure release signing (if secrets present)
        env:
          KEYSTORE_BASE_64: ${{ secrets.KEYSTORE_BASE_64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEYSTORE_ALIAS: ${{ secrets.RELEASE_KEYSTORE_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE_64" ]; then
            echo "$KEYSTORE_BASE_64" | base64 -d > android/app/keystore.jks
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\n' \
              "$RELEASE_KEYSTORE_PASSWORD" "$RELEASE_KEY_PASSWORD" "$RELEASE_KEYSTORE_ALIAS" \
              > android/app/key.properties
            echo "Release keystore configured — APKs will be release-signed."
          else
            echo "No KEYSTORE_BASE_64 secret set — release APKs will be debug-signed."
          fi
      - run: flutter pub get
      - name: Build Android APKs
        # Jetifier can fail intermittently; retry once.
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 2
          command: flutter build apk --${{ matrix.mode }} --split-per-abi --flavor production --build-number=${{ github.run_number }}
      - name: Collect APKs
        env:
          BUILD_MODE: ${{ matrix.mode }}
        run: |
          mkdir -p dist-apk
          SUFFIX=""
          if [[ "$BUILD_MODE" == debug ]]; then SUFFIX="-debug"; fi
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-production-${BUILD_MODE}.apk" \
               "dist-apk/Driftfin-Android-${{ needs.prepare.outputs.version }}-${abi}${SUFFIX}.apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: android-${{ matrix.mode }}
          path: dist-apk/*.apk

  macos_desktop:
    name: Build macOS
    if: ${{ !inputs.ios_only }}
    needs: prepare
    runs-on: blacksmith-6vcpu-macos-latest
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --flavor production --build-number=${{ github.run_number }}
      - name: Zip .app
        run: |
          APP=$(find build/macos/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "Packaging: $APP"
          ditto -c -k --keepParent "$APP" "Driftfin-macOS-${{ needs.prepare.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: macos
          path: Driftfin-macOS-*.zip

  linux:
    name: Build Linux
    if: ${{ !inputs.ios_only }}
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true
      - name: Install Linux build deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev libmpv-dev patchelf cmake clang libfuse2 libcurl4-openssl-dev openjdk-17-jdk-headless
      - run: flutter pub get
      - run: flutter build linux --release --build-number=${{ github.run_number }}
      - name: Zip bundle
        run: cd build/linux/x64/release/bundle && zip -r "$GITHUB_WORKSPACE/Driftfin-Linux-${{ needs.prepare.outputs.version }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: linux
          path: Driftfin-Linux-*.zip

  release:
    name: Publish GitHub Release
    needs: [prepare, web, windows, ios, android, macos_desktop, linux]
    # All platform artifacts must exist before making a release public.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -R dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Driftfin ${{ needs.prepare.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'nightly') }}
          fail_on_unmatched_files: true
          files: dist/**/*
          body: |
            **Driftfin ${{ needs.prepare.outputs.version }}** — a cross-platform Jellyfin client.

            Driftfin is a fork of [Fladder](https://github.com/DonutWare/Fladder) by DonutWare, continued under the same **GPL-3.0** license. All credit for the original application goes to the Fladder authors.

            ### Downloads
            - **Web** (`Driftfin-Web-*.zip`) — unzip and serve behind any static host; open in a browser.
            - **Windows installer** (`Driftfin-Windows-*-Setup.exe`) — recommended; installs to your user profile with Start Menu shortcuts.
            - **Windows portable** (`Driftfin-Windows-*.zip`) — unzip and run `driftfin.exe`; supports in-app self-update.
            - **iOS** (`Driftfin-iOS-*-unsigned.ipa`) — **unsigned**; sideload with AltStore / Sideloadly or re-sign yourself.
            - **Android** (`Driftfin-Android-*.apk`) — **release** build (AOT-optimized); the recommended download. Install the APK matching your device's ABI. Signed with the project release key when configured, otherwise debug-signed.
            - **Android debug** (`Driftfin-Android-*-debug.apk`) — slower debug build with assertions and verbose logs; only grab this if you're reproducing a bug for a report.
            - **macOS** (`Driftfin-macOS-*.zip`) — unsigned `.app`; unzip and run (you may need to allow it in Gatekeeper).
            - **Linux** (`Driftfin-Linux-*.zip`) — portable bundle; needs `libmpv` (`sudo apt install libmpv-dev`). Unzip and run `driftfin`.

  pages:
    name: Publish Pages
    needs: [prepare, web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Assemble Pages site from the web build
        run: |
          mkdir -p dist-pages/app
          cp -r site/. dist-pages/
          unzip -q "dist/Driftfin-Web-${{ needs.prepare.outputs.version }}.zip" -d dist-pages/app
          python3 - <<'PYTHON'
          from pathlib import Path
          index = Path("dist-pages/app/index.html")
          html = index.read_text()
          assert html.count('<base href="/">') == 1, "Unexpected Flutter base href"
          index.write_text(html.replace('<base href="/">', '<base href="/Driftfin/app/">'))
          PYTHON
      # The plugin workflow also publishes /jellyfin-plugin/ to this branch.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist-pages
          keep_files: true

  testflight:
    name: Upload TestFlight
    if: github.event_name == 'workflow_dispatch' && inputs.testflight == true
    needs: ios
    runs-on: macos-26
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: dist
      - name: Locate signed IPA
        id: ipa
        shell: bash
        run: |
          IPA_PATH="$(find dist -maxdepth 1 -type f -name '*-signed.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'
