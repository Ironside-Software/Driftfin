name: iOS TestFlight

# Builds the production iOS flavor, signs it with the Apple credentials stored
# in the testflight environment, and uploads the IPA to App Store Connect.
# This workflow is intentionally manual by default. A tag named ios-v* can be
# used for a deliberate release once the first manual run is proven.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: true
        default: develop
        type: string
      release_notes:
        description: Optional TestFlight What to Test notes
        required: false
        type: string
  push:
    tags:
      - "ios-v*"

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  APPSTORE_BUNDLE_ID: app.driftfin.79758DD3NW

jobs:
  build-and-upload:
    runs-on: macos-15
    environment: testflight
    steps:
      - name: Check out requested ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Import App Store distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.APPSTORE_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build signed production IPA
        run: >-
          flutter build ipa
          --release
          --flavor production
          --build-number=${{ github.run_number }}
          --export-options-plist=ios/exportOptions.plist

      - name: Locate IPA
        id: ipa
        shell: bash
        run: |
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -n "$IPA_PATH"
          echo "path=$IPA_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          release-notes: ${{ inputs.release_notes }}
          uses-non-exempt-encryption: 'false'
          wait-for-processing: 'true'
