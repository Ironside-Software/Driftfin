name: Plugin (Jellyfin)

on:
  push:
    paths:
      - 'jellyfin-plugin/**'
      - '.github/workflows/plugin.yaml'
    tags: ["plugin-v*"]
  pull_request:
    paths:
      - 'jellyfin-plugin/**'
      - '.github/workflows/plugin.yaml'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and test on Jellyfin 12
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate release metadata
        id: meta
        run: |
          pip install --quiet pyyaml
          python3 jellyfin-plugin/scripts/validate_metadata.py >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s jellyfin-plugin/scripts -p 'test_*.py' -v

      - name: Build and test
        run: dotnet test jellyfin-plugin/Jellyfin.Plugin.Driftfin.Tests/Jellyfin.Plugin.Driftfin.Tests.csproj -c Release

      - name: Verify Jellyfin 12 and real Seerr attribution, quotas and approvals
        run: python3 jellyfin-plugin/scripts/smoke_test.py --with-seerr

      - name: Package tested plugin
        run: |
          mkdir -p dist
          cp jellyfin-plugin/Jellyfin.Plugin.Driftfin/bin/Release/${{ steps.meta.outputs.framework }}/Jellyfin.Plugin.Driftfin.dll dist/
          cd dist
          zip "driftfin-plugin-${{ steps.meta.outputs.version }}.zip" Jellyfin.Plugin.Driftfin.dll

      - uses: actions/upload-artifact@v4
        with:
          name: driftfin-plugin
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish tested plugin
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    needs: build
    runs-on: blacksmith-2vcpu-ubuntu-2404
    concurrency:
      group: driftfin-plugin-catalog
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: driftfin-plugin
          path: dist

      - name: Prepare catalog update
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_VERSION: ${{ needs.build.outputs.version }}
        run: |
          pip install --quiet pyyaml
          # Fail on retrieval errors: replacing history with [] would strand older servers.
          gh api "repos/${GITHUB_REPOSITORY}/contents/jellyfin-plugin/manifest.json?ref=gh-pages" \
            --jq '.content' | base64 --decode > existing-manifest.json
          ZIP_NAME="driftfin-plugin-${PLUGIN_VERSION}.zip"
          CHECKSUM="$(md5sum "dist/${ZIP_NAME}" | cut -d' ' -f1)"
          python3 jellyfin-plugin/scripts/update_manifest.py \
            --build-yaml jellyfin-plugin/build.yaml \
            --existing existing-manifest.json \
            --source-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}" \
            --checksum "$CHECKSUM" \
            --timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --image-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/develop/icons/production/driftfin_icon_512.png" \
            --output manifest-out/jellyfin-plugin/manifest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Driftfin plugin ${{ needs.build.outputs.version }} (Jellyfin 12)
          make_latest: false
          files: dist/*.zip
          body: |
            Requires **Jellyfin 12 / .NET 10**. Existing plugin settings are preserved.
            Older servers can continue using plugin 1.0.2.0 from the same catalog.

            Add this repository in **Dashboard → Plugins → Repositories**:
            `https://ironside-software.github.io/Driftfin/jellyfin-plugin/manifest.json`
            Install/update Driftfin and restart Jellyfin.

            Manual install: extract the ZIP into the Driftfin plugin directory and restart.
            [Documentation](https://github.com/${{ github.repository }}/blob/develop/jellyfin-plugin/README.md)

      # Shared with the app/landing site; preserve their files.
      - name: Deploy catalog to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./manifest-out
          keep_files: true
